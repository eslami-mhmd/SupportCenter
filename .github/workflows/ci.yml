name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore SupportCenter.slnx

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/SupportCenter.UnitTests/SupportCenter.UnitTests.csproj --no-build --configuration Release --verbosity minimal

    - name: Run Architecture Tests
      run: dotnet test tests/SupportCenter.ArchitectureTests/SupportCenter.ArchitectureTests.csproj --no-build --configuration Release --verbosity minimal

    - name: Run Integration Tests
      run: dotnet test tests/SupportCenter.IntegrationTests/SupportCenter.IntegrationTests.csproj --no-build --configuration Release --verbosity minimal
